[project]
name = "segment-studio-analysis"
version = "0.1.0"
description = "GPU video analysis service for Segment Studio"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi==0.116.1",
    "httpx==0.28.1",
    "pydantic==2.11.7",
    "python-json-logger==3.3.0",
    "uvicorn==0.35.0",
]

[project.optional-dependencies]
test = [
    "pytest==8.4.1",
    "pytest-asyncio==1.1.0",
]
model = [
    "accelerate==1.13.0",
    "ffmpeg-python==0.2.0",
    "huggingface-hub==0.36.2",
    "imageio==2.37.3",
    "imageio-ffmpeg==0.6.0",
    "matplotlib==3.10.9",
    "numpy==2.2.6",
    "omegaconf==2.3.0",
    "opencv-python==4.13.0.92",
    "pandas==2.3.3",
    "pyyaml==6.0.3",
    "scikit-learn==1.7.2",
    "torch==2.5.1",
    "torchaudio==2.5.1",
    "torchvision==0.20.1",
    "tqdm==4.67.3",
    "transformers==4.57.3",
]

[project.scripts]
segment-studio-analysis = "segment_studio_analysis.main:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["segment_studio_analysis"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
package = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
