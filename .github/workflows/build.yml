name: Build, Test, and Release Extensions

on:
  push:
    tags:
      - '*/v*'
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '24'

permissions:
  contents: read

jobs:
  select-extension:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.extensions.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - name: Select extension packages
        id: extensions
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const root = 'extensions';
          const entries = fs.readdirSync(root, { withFileTypes: true })
            .filter(entry => entry.isDirectory())
            .map(entry => ({ directory: entry.name, descriptor: path.join(root, entry.name, 'release.json') }))
            .filter(entry => fs.existsSync(entry.descriptor))
            .map(entry => ({
              uiPackagePath: 'ui',
              ...JSON.parse(fs.readFileSync(entry.descriptor, 'utf8')),
              path: path.join(root, entry.directory),
            }));

          const required = ['id', 'name', 'tagPrefix', 'solution', 'project', 'manifest', 'readme', 'ui'];
          for (const entry of entries) {
            for (const field of required) {
              if (!entry[field]) throw new Error(`${entry.path}/release.json is missing ${field}`);
            }
            for (const field of ['solution', 'project', 'manifest', 'readme']) {
              if (!fs.existsSync(path.join(entry.path, entry[field]))) {
                throw new Error(`${entry.path}/release.json references a missing ${field}: ${entry[field]}`);
              }
            }
            if (entry.uiBuildDirectory) {
              if (!fs.existsSync(path.join(entry.path, entry.uiBuildDirectory))) {
                throw new Error(`${entry.path}/release.json references a missing uiBuildDirectory: ${entry.uiBuildDirectory}`);
              }
            } else if (!fs.existsSync(path.join(entry.path, entry.ui))) {
              throw new Error(`${entry.path}/release.json references a missing ui: ${entry.ui}`);
            }
          }

          if (entries.length === 0) throw new Error('No extension release descriptors found.');

          let selected = entries;
          if (process.env.GITHUB_EVENT_NAME !== 'pull_request') {
            const tag = process.env.GITHUB_REF_NAME;
            selected = entries.filter(entry => tag.startsWith(entry.tagPrefix));
            if (selected.length !== 1) throw new Error(`Release tag '${tag}' must match exactly one extension tag prefix.`);

            const version = tag.slice(selected[0].tagPrefix.length);
            if (!/^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/.test(version)) {
              throw new Error(`Release tag '${tag}' has invalid version '${version}'.`);
            }

            const manifest = JSON.parse(fs.readFileSync(path.join(selected[0].path, selected[0].manifest), 'utf8'));
            if (manifest.id !== selected[0].id) throw new Error(`${selected[0].path}: manifest id '${manifest.id}' does not match '${selected[0].id}'.`);
            if (manifest.version !== version.slice(1)) {
              throw new Error(`${selected[0].path}: manifest version '${manifest.version}' does not match release version '${version.slice(1)}'.`);
            }
          }

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({ extension: selected })}\n`);
          NODE

  build:
    needs: select-extension
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      matrix: ${{ fromJson(needs.select-extension.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Setup Node
        if: matrix.extension.uiBuildDirectory
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.extension.path }}/${{ matrix.extension.uiBuildDirectory }}/package-lock.json
      - name: Test and build extension UI
        if: matrix.extension.uiBuildDirectory
        working-directory: ${{ matrix.extension.path }}/${{ matrix.extension.uiBuildDirectory }}
        run: |
          npm ci
          npm test
          npm run build
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "value=0.0.0" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#${{ matrix.extension.tagPrefix }}v}" >> "$GITHUB_OUTPUT"
          fi
      - name: Restore
        run: dotnet restore ${{ matrix.extension.path }}/${{ matrix.extension.solution }} --property:UseLocalCoveSource=false --property:UseLocalCoveCore=false
      - name: Test
        env:
          COVE__Postgres__ConnectionString: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres
        run: dotnet test ${{ matrix.extension.path }}/${{ matrix.extension.solution }} --configuration Release --no-restore --property:Version=${{ steps.version.outputs.value }} --property:ContinuousIntegrationBuild=true --property:UseLocalCoveSource=false --property:UseLocalCoveCore=false
      - name: Test UI
        if: matrix.extension.uiTest
        run: node --test ${{ matrix.extension.path }}/${{ matrix.extension.uiTest }}
      - name: Test migration operators
        if: matrix.extension.pythonTests
        env:
          SEGMENT_STUDIO_MIGRATION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        shell: bash
        run: |
          for test_file in ${{ matrix.extension.pythonTests }}; do
            python3 "${{ matrix.extension.path }}/$test_file"
          done
      - name: Publish
        run: dotnet publish ${{ matrix.extension.path }}/${{ matrix.extension.project }} --configuration Release --output artifacts/publish/${{ matrix.extension.name }} --no-build --property:Version=${{ steps.version.outputs.value }} --property:ContinuousIntegrationBuild=true --property:UseLocalCoveSource=false --property:UseLocalCoveCore=false
      - name: Assemble package
        shell: bash
        run: |
          mkdir -p artifacts/${{ matrix.extension.name }}
          cp ${{ matrix.extension.path }}/${{ matrix.extension.manifest }} artifacts/${{ matrix.extension.name }}/extension.json
          cp ${{ matrix.extension.path }}/${{ matrix.extension.readme }} artifacts/${{ matrix.extension.name }}/README.md
          cp ${{ matrix.extension.path }}/LICENSE artifacts/${{ matrix.extension.name }}/LICENSE
          cp artifacts/publish/${{ matrix.extension.name }}/${{ matrix.extension.name }}.dll artifacts/${{ matrix.extension.name }}/
          if [[ -d "${{ matrix.extension.path }}/${{ matrix.extension.ui }}" ]]; then
            mkdir -p artifacts/${{ matrix.extension.name }}/${{ matrix.extension.uiPackagePath }}
            cp -R ${{ matrix.extension.path }}/${{ matrix.extension.ui }}/. artifacts/${{ matrix.extension.name }}/${{ matrix.extension.uiPackagePath }}/
          fi
          if [[ -n "${{ matrix.extension.docs }}" && -d "${{ matrix.extension.path }}/${{ matrix.extension.docs }}" ]]; then
            mkdir -p artifacts/${{ matrix.extension.name }}/docs
            cp -R ${{ matrix.extension.path }}/${{ matrix.extension.docs }}/. artifacts/${{ matrix.extension.name }}/docs/
          fi
      - name: Stamp packaged manifest version
        run: |
          node -e "const fs=require('fs'); const file='artifacts/${{ matrix.extension.name }}/extension.json'; const json=JSON.parse(fs.readFileSync(file,'utf8')); json.version='${{ steps.version.outputs.value }}'; fs.writeFileSync(file, JSON.stringify(json, null, 2) + '\n');"
      - name: Validate assembled package
        run: node ${{ matrix.extension.path }}/scripts/validate-extension-package.mjs artifacts/${{ matrix.extension.name }} ${{ steps.version.outputs.value }} ${{ matrix.extension.id }}
      - name: Package
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          cd artifacts/${{ matrix.extension.name }}
          zip -r ../../${{ matrix.extension.id }}-${{ steps.version.outputs.value }}.zip .
          cd ../..
          sha256sum ${{ matrix.extension.id }}-${{ steps.version.outputs.value }}.zip > ${{ matrix.extension.id }}-${{ steps.version.outputs.value }}.zip.sha256
      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.extension.id }}
          path: |
            ${{ matrix.extension.id }}-*.zip
            ${{ matrix.extension.id }}-*.zip.sha256
          if-no-files-found: error

  analysis-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/segment-studio-analysis
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
          cache-dependency-glob: services/segment-studio-analysis/uv.lock
      - name: Test analysis service
        run: uv run --locked --extra test pytest
      - name: Verify generated OpenAPI contract
        run: |
          uv run --locked python scripts/generate-openapi.py
          git diff --exit-code -- openapi.json

  release:
    needs: [build, analysis-service]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            *.zip
            *.zip.sha256
          generate_release_notes: true
