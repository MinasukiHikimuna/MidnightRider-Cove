name: Build, Test, and Release Extensions

on:
  push:
    tags:
      - '*/v*'
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '24'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.catalog.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - name: Validate extension catalog and manifests
        run: node scripts/validate-extension-repo.mjs
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const tag = process.env.GITHUB_REF_NAME;
          const catalog = JSON.parse(fs.readFileSync('extensions/catalog.json', 'utf8'));
          const matches = catalog.extensions.filter(entry => tag.startsWith(entry.tagPrefix));
          if (matches.length !== 1) {
            console.error(`ERROR: Release tag '${tag}' must match exactly one catalog tagPrefix.`);
            process.exit(1);
          }
          const extension = matches[0];
          const versionTag = tag.slice(extension.tagPrefix.length);
          if (!/^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/.test(versionTag)) {
            console.error(`ERROR: Release tag '${tag}' does not contain a valid semantic version.`);
            process.exit(1);
          }
          const version = versionTag.slice(1);
          const manifest = JSON.parse(fs.readFileSync(`${extension.path}/extension.json`, 'utf8'));
          if (manifest.version !== version) {
            console.error(`ERROR: Tag version ${version} does not match manifest version ${manifest.version}.`);
            process.exit(1);
          }
          if (extension.id === 'animated-tag-previews' && fs.readFileSync('README.md', 'utf8').includes('TODO(COVE_MIN_VERSION)')) {
            console.error('ERROR: Animated Tag Previews cannot be released until its production Cove minimum is set.');
            process.exit(1);
          }
          NODE
      - name: Build extension matrix
        id: catalog
        run: |
          node <<'NODE'
          const fs = require('fs');
          const catalog = JSON.parse(fs.readFileSync('extensions/catalog.json', 'utf8'));
          const tag = process.env.GITHUB_REF_NAME;
          const extensions = process.env.GITHUB_EVENT_NAME === 'pull_request'
            ? catalog.extensions
            : catalog.extensions.filter(entry => tag.startsWith(entry.tagPrefix));
          if (extensions.length === 0) {
            console.error(`ERROR: No extension matches release tag '${tag}'.`);
            process.exit(1);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({ extension: extensions })}\n`);
          NODE

  build:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.validate.outputs.matrix) }}
    steps:
      - name: Resolve build version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "value=0.0.0" >> "$GITHUB_OUTPUT"
          else
            tag="${GITHUB_REF#refs/tags/}"
            echo "value=${tag#${{ matrix.extension.tagPrefix }}v}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6

      - name: Check out development Cove contracts
        if: matrix.extension.developmentCoveRef
        uses: actions/checkout@v6
        with:
          repository: ${{ matrix.extension.developmentCoveRepository }}
          ref: ${{ matrix.extension.developmentCoveRef }}
          path: cove-source

      - name: Setup .NET
        if: '!matrix.extension.manifestOnly'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node
        if: matrix.extension.uiDirectory
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.extension.uiDirectory }}/package-lock.json

      - name: Test and build extension UI
        if: matrix.extension.uiDirectory
        working-directory: ${{ matrix.extension.uiDirectory }}
        run: |
          npm ci
          npm test
          npm run build

      - name: Restore
        if: '!matrix.extension.manifestOnly'
        shell: bash
        run: |
          if [[ -n "${{ matrix.extension.developmentCoveRef }}" ]]; then
            source_arguments=(--property:UseLocalCoveSource=true --property:UseLocalCoveCore=true --property:CoveSourceRoot="$GITHUB_WORKSPACE/cove-source")
          else
            source_arguments=(--property:UseLocalCoveSource=false --property:UseLocalCoveCore=false)
          fi
          dotnet restore "${{ matrix.extension.solution }}" "${source_arguments[@]}"

      - name: Test
        if: '!matrix.extension.manifestOnly'
        shell: bash
        run: |
          if [[ -n "${{ matrix.extension.developmentCoveRef }}" ]]; then
            source_arguments=(--property:UseLocalCoveSource=true --property:UseLocalCoveCore=true --property:CoveSourceRoot="$GITHUB_WORKSPACE/cove-source")
          else
            source_arguments=(--property:UseLocalCoveSource=false --property:UseLocalCoveCore=false)
          fi
          dotnet test "${{ matrix.extension.solution }}" --configuration Release --no-restore --property:Version=${{ steps.version.outputs.value }} --property:ContinuousIntegrationBuild=true "${source_arguments[@]}"

      - name: Publish
        if: '!matrix.extension.manifestOnly'
        shell: bash
        run: |
          if [[ -n "${{ matrix.extension.developmentCoveRef }}" ]]; then
            source_arguments=(--property:UseLocalCoveSource=true --property:UseLocalCoveCore=true --property:CoveSourceRoot="$GITHUB_WORKSPACE/cove-source")
          else
            source_arguments=(--property:UseLocalCoveSource=false --property:UseLocalCoveCore=false)
          fi
          dotnet publish "${{ matrix.extension.path }}" --configuration Release --output "artifacts/publish/${{ matrix.extension.name }}" --no-restore --property:Version=${{ steps.version.outputs.value }} --property:ContinuousIntegrationBuild=true "${source_arguments[@]}"

      - name: Assemble package
        env:
          EXTENSION_JSON: ${{ toJson(matrix.extension) }}
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const extension = JSON.parse(process.env.EXTENSION_JSON);
          const manifestPath = path.join(extension.path, 'extension.json');
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          manifest.version = process.env.RELEASE_VERSION;
          const output = path.join('artifacts', extension.name);
          fs.mkdirSync(output, { recursive: true });
          fs.writeFileSync(path.join(output, 'extension.json'), `${JSON.stringify(manifest, null, 2)}\n`);
          const readme = path.join(extension.path, 'README.md');
          fs.copyFileSync(fs.existsSync(readme) ? readme : 'README.md', path.join(output, 'README.md'));
          fs.copyFileSync('LICENSE', path.join(output, 'LICENSE'));
          if (manifest.entryDll) fs.copyFileSync(path.join('artifacts/publish', extension.name, path.basename(manifest.entryDll)), path.join(output, manifest.entryDll));
          for (const asset of [manifest.jsBundle, manifest.cssBundle].filter(Boolean)) {
            const destination = path.join(output, asset);
            fs.mkdirSync(path.dirname(destination), { recursive: true });
            fs.copyFileSync(path.join(extension.path, asset), destination);
          }
          NODE

      - name: Validate assembled package
        run: node scripts/validate-extension-package.mjs "artifacts/${{ matrix.extension.name }}" "${{ steps.version.outputs.value }}" "${{ matrix.extension.id }}"

      - name: Package
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          cd "artifacts/${{ matrix.extension.name }}"
          zip --recurse-paths --quiet "../../${{ matrix.extension.id }}-${{ steps.version.outputs.value }}.zip" .
          cd ../..
          sha256sum "${{ matrix.extension.id }}-${{ steps.version.outputs.value }}.zip" > "${{ matrix.extension.id }}-${{ steps.version.outputs.value }}.zip.sha256"

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.extension.id }}
          path: |
            ${{ matrix.extension.id }}-*.zip
            ${{ matrix.extension.id }}-*.zip.sha256
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            *.zip
            *.zip.sha256
          generate_release_notes: true
